# Quick local run without installing PostgreSQL:
#   Windows:  .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
#   Linux:    ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Data is kept in ./data/ (ignored by git). Never use this profile on the VPS.
spring.datasource.url=jdbc:h2:file:./data/parkflow-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
parkflow.admin.username=${PARKFLOW_ADMIN_USERNAME:admin}
parkflow.admin.password=${PARKFLOW_ADMIN_PASSWORD:admin-local-only}
