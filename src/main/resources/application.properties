spring.application.name=ParkFlow
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=0
server.error.include-message=never
server.error.include-stacktrace=never

# --- Database (PostgreSQL). Tables are created by Flyway from src/main/resources/db/migration. ---
spring.datasource.url=${PARKFLOW_DB_URL:jdbc:postgresql://localhost:5432/parkflow}
spring.datasource.username=${PARKFLOW_DB_USER:parkflow}
spring.datasource.password=${PARKFLOW_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Login tokens. Set PARKFLOW_JWT_SECRET to a random string of 32+ characters in production. ---
parkflow.jwt.secret=${PARKFLOW_JWT_SECRET:}
parkflow.jwt.ttl=${PARKFLOW_JWT_TTL:7d}

# --- First admin account, created at startup if it does not exist yet. ---
parkflow.admin.username=${PARKFLOW_ADMIN_USERNAME:}
parkflow.admin.password=${PARKFLOW_ADMIN_PASSWORD:}

# --- Place search (OpenStreetMap Nominatim, free). Optional: limit to countries, e.g. "ca". ---
parkflow.geocoder.url=${PARKFLOW_GEOCODER_URL:https://nominatim.openstreetmap.org}
parkflow.geocoder.user-agent=${PARKFLOW_GEOCODER_USER_AGENT:ParkFlow/1.0 (https://www.parkflow.tech)}
parkflow.geocoder.country-codes=${PARKFLOW_GEOCODER_COUNTRIES:}

# --- Private clipboard. No default key: set PARKFLOW_API_KEY on the server, or the clipboard stays off. ---
parkflow.clipboard.timezone=${PARKFLOW_TIMEZONE:America/Toronto}
parkflow.api-key=${PARKFLOW_API_KEY:}
