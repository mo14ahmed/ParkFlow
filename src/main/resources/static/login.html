<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <title>Log in | ParkFlow</title>
</head>
<body>
<header id="topbar"></header>
<main class="narrow">
    <h1>Log in</h1>
    <p class="lead">Customers find parking near where they're going. Providers manage their parking buildings.</p>
    <div id="msg" class="msg"></div>
    <form id="form" class="card edge-blue" novalidate>
        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="muted small">New to ParkFlow? <a href="signup.html">Create an account</a>.</p>
</main>
<script src="js/app.js"></script>
<script>
(function () {
  PF.renderNav("login.html");
  const params = new URLSearchParams(location.search);
  const msg = document.getElementById("msg");
  if (params.get("expired")) PF.say(msg, "Your session ended. Log in again.", "warn");
  const form = document.getElementById("form");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = PF.formData(form);
    if (!data.username || !data.password) { PF.say(msg, "Enter your username and password.", "error"); return; }
    const btn = form.querySelector("button"); btn.disabled = true;
    try {
      const auth = await PF.api("POST", "/api/auth/login", { username: data.username, password: data.password });
      PF.saveSession(auth);
      const next = params.get("next");
      location.href = next && /^[a-z0-9_-]+\.html$/i.test(next) ? next : PF.homeFor(auth.user);
    } catch (err) {
      PF.say(msg, err.message, "error");
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
