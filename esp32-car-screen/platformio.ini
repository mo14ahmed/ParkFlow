; ParkFlow car screen for the Elecrow CrowPanel 5.0" ESP32-S3 (ESP32-S3-WROOM-1-N4R8).
; Arduino core 3 (pioarduino platform) + LVGL 9 + Espressif's RGB LCD driver with a bounce buffer.
; No ESP-IDF install or menuconfig needed: Arduino core 3 ships ESP-IDF 5 prebuilt.

[platformio]
; Keep PlatformIO's downloads in a short folder: some Arduino core 3 file paths are longer than
; Windows allows under C:\Users\<name>\.platformio (unless long paths are turned on).
core_dir = E:/pio

[env:crowpanel5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Change these if Windows gives the board a different COM port.
monitor_port = COM6
upload_port = COM6

; The module has 4 MB flash (quad) and 8 MB octal PSRAM.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
; One big app partition (3 MB): LVGL + Wi-Fi + HTTPS don't fit the default 1.25 MB.
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -O2
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@^7.0.0
